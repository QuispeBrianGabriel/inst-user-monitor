[package]
name = "front"
version = "0.2.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3", features = ["Performance", "Storage", "Window"] }
gloo-timers = { version = "0.4", features = ["futures"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
