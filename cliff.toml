# Configuración de git-cliff (changelog de las GitHub Releases) basada en Conventional Commits.
[changelog]
header = "# Changelog\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Novedades" },
  { message = "^fix", group = "<!-- 1 -->🐛 Correcciones" },
  { message = "^perf", group = "<!-- 2 -->⚡ Rendimiento" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
  { message = "^doc", group = "<!-- 4 -->📚 Documentación" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|ci|build|test|style)", group = "<!-- 5 -->⚙️ Mantenimiento" },
]
tag_pattern = "v[0-9].*"
