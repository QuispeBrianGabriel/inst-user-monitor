name: Pipeline

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Lee rust-toolchain.toml (stable + wasm32) y cachea ~/.cargo y target/
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,leptosfmt
      - run: make check
