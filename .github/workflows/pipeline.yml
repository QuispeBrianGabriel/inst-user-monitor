name: Pipeline

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Lee rust-toolchain.toml (1.100.0 + wasm32) y cachea ~/.cargo y target/
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: rustfmt, clippy
      # Mismas versiones que docker/dockerfile.dev y docker/dockerfile.prod
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: trunk@0.22.1,leptosfmt@0.1.33
      - run: make check
