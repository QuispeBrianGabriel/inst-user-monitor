name: inst-user-monitor-front

services:
  web:
    build:
      context: ..
      dockerfile: docker/dockerfile.dev
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    volumes:
      - ..:/app:cached
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target
    ports:
      - "${DEV_PORT:-3000}:3000"
    command: sleep infinity

  # Producción: docker compose --profile prod up --build web-prod
  web-prod:
    profiles: ["prod"]
    build:
      context: ..
      dockerfile: docker/dockerfile.prod
    # Configuración de runtime: la misma imagen sirve para cualquier entorno
    environment:
      PORT: 80
      API_URL: ${API_URL:-http://localhost:8080}
    ports:
      - "${PROD_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  cargo-registry:
  cargo-target:
